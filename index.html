    <title>نظام إدارة وتحليل نتائج الطلاب</title>
    <style>
        body { font-family: Tahoma, sans-serif; padding: 20px; background-color: #f9f9f9; }
        .box { background: #fff; padding: 15px; margin-bottom: 10px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { color: #333; }
    </style>

<body>
    <h1>نظام إدارة وتحليل نتائج الطلاب</h1>
    <div id="output"></div>

    <script>
        class Student {
            constructor(id, name, grades, attendance) {
                this.id = id;
                this.name = name;
                this.grades = grades; 
                this.attendance = attendance; 
            }

            calculateAverage() {
                const sum = this.grades.reduce((total, grade) => total + grade, 0);
                return sum / this.grades.length;
            }

            getGradeLetter() {
                const avg = this.calculateAverage();
                if (avg >= 90) return 'A';
                if (avg >= 80) return 'B';
                if (avg >= 70) return 'C';
                if (avg >= 60) return 'D';
                if (avg >= 50) return 'E';
                return 'F';
            }

            getStatus() {
                const avg = this.calculateAverage();
                if (avg >= 50 && this.attendance >= 75) {
                    return "ناجح";
                } else {
                    return "يحتاج مراجعة";
                }
            }
        }

            new Student(2, "احمد محمد ", [42, 45, 44], 85),

            new Student(4, "شاهنده محمود", [46, 48, 43], 90)  
        ];

        const outputDiv = document.getElementById("output");

        });
